[package]
name = "rustfile"
version = "0.1.0"
description = """Library for a Rust equivalent of homebrew's Brewfile configuration"""
documentation = "https://docs.rs/rustfile/"
repository = "https://github.com/johnstonskj/rust-rustfile.git"
license = "MIT/Apache-2.0"
edition = "2024"
publish = true

[package.metadata.docs.rs]
# This sets the default target to `x86_64-unknown-linux-gnu`
# and only builds that target for documentation.
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = []
command-line = ["tracing-subscriber"]
serde = []

[dependencies]
ariadne = "0.6.0"
chumsky = "0.14.1"
flat_error = "0.3"
regex = "1.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
url = "2.5"

[dev-dependencies]
pretty_assertions = "1.4"
claims = "0.8"
